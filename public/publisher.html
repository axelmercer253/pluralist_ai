<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publisher Dashboard - Pluralist AI</title>
  <link rel="stylesheet" href="nctheme.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo"><div class="logo-icon">▣</div><span>Pluralist AI</span></div>
      <nav class="nav">
        <a class="nav-item" href="/"><span class="nav-icon">⌂</span><span>Home</span></a>
        <a class="nav-item active" href="/publisher.html"><span class="nav-icon">▦</span><span>Publisher</span></a>
        <a class="nav-item" href="#" id="signOutLink"><span class="nav-icon">↩</span><span>Sign Out</span></a>
      </nav>
      <button class="theme-toggle" id="themeToggle" type="button"><span>☼</span><span>Light / Dark</span></button>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="search"><input type="search" placeholder="Search stories..."><span class="search-icon">⌕</span></div>
        <div class="topbar-spacer"></div>
        <button class="notification" type="button">♧</button>
        <div class="avatar">A</div>
      </header>

      <div class="content">
        <section class="publisher-panel">
          <h1>Publisher Dashboard</h1>
          <p>Upload audio/video content and submit articles for admin moderation.</p>
        </section>

        <section class="form-card">
          <h2>Upload Media</h2>
          <form id="mediaUploadForm">
            <label for="mediaTitle">Title</label>
            <input id="mediaTitle" name="title" type="text" required maxlength="120" />

            <label for="mediaUrl">Media URL</label>
            <input id="mediaUrl" name="url" type="url" required />

            <label for="mediaType">Media Type</label>
            <select id="mediaType" name="mediaType" required>
              <option value="audio">Audio</option>
              <option value="video">Video</option>
            </select>

            <label for="mediaDescription">Description</label>
            <textarea id="mediaDescription" name="description" maxlength="300"></textarea>
            <button type="submit">Upload for Review</button>
          </form>
        </section>

        <section class="form-card">
          <h2>Submit Article</h2>
          <form id="publisherArticleForm">
            <label for="articleTitle">Title</label>
            <input id="articleTitle" name="title" type="text" required maxlength="150" />

            <label for="articleContent">Content</label>
            <textarea id="articleContent" name="content" required maxlength="3000"></textarea>

            <button type="submit">Submit Article</button>
          </form>
        </section>
      </div>
    </main>
  </div>

  <!-- Slim sticky AI chat (from news_template) -->
  <div class="ai-chat-bar">
    <div class="ai-chat-inner">
      <div class="ai-badge">✦</div>
      <div>
        <div class="ai-title">News AI</div>
        <div class="ai-status">Ask about today's stories</div>
      </div>
      <input class="ai-input" id="aiInput" type="text" placeholder="Ask AI about the news...">
      <div class="ai-response" id="aiResponse"></div>
      <button class="ai-send" id="aiSend">Ask AI</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="nctheme.js"></script>
</body>
</html>
