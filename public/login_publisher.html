<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In (Publisher) - Pluralist AI</title>
  <link rel="stylesheet" href="nctheme.css" />
</head>
<body data-required-role="publisher">
  <div class="app">
    <aside class="sidebar">
      <div class="logo"><div class="logo-icon">▣</div><span>Pluralist AI</span></div>
      <nav class="nav">
        <a class="nav-item" href="/">Home</a>
        <a class="nav-item" href="/signup.html">Sign Up</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" type="button"><span>☼</span><span>Light / Dark</span></button>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="search"><input type="search" placeholder="Search stories..."><span class="search-icon">⌕</span></div>
        <div class="topbar-spacer"></div>
        <button class="notification" type="button">♧</button>
        <div class="avatar">A</div>
      </header>

      <div class="content">
        <section class="form-card">
          <h2>Sign In (Publisher)</h2>
          <form id="loginForm">
            <label for="loginEmail">Email</label>
            <input id="loginEmail" name="email" type="email" required />
            <label for="loginPassword">Password</label>
            <input id="loginPassword" name="password" type="password" required />
            <button type="submit">Sign In</button>
          </form>
        </section>
      </div>
    </main>
  </div>

  <div class="ai-chat-bar">
    <div class="ai-chat-inner">
      <div class="ai-badge">✦</div>
      <div>
        <div class="ai-title">News AI</div>
        <div class="ai-status">Ask about today's stories</div>
      </div>
      <input class="ai-input" id="aiInput" type="text" placeholder="Ask AI about the news...">
      <div class="ai-response" id="aiResponse"></div>
      <button class="ai-send" id="aiSend">Ask AI</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="nctheme.js"></script>
</body>
</html>
