<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - Pluralist AI</title>
  <link rel="stylesheet" href="nctheme.css" />
</head>
<body>
  <div class="app">
      <aside class="sidebar">
      <div class="logo"><div class="logo-icon">▣</div><span>Pluralist AI</span></div>
      <nav class="nav">
        <a class="nav-item" href="/"><span class="nav-icon">⌂</span><span>Home</span></a>
        <a class="nav-item active" href="/admin.html"><span class="nav-icon">⚙</span><span>Admin</span></a>
        <a class="nav-item" href="/reader.html"><span class="nav-icon">⌁</span><span>Reader</span></a>
        <a class="nav-item" href="/publisher.html"><span class="nav-icon">▦</span><span>Publisher</span></a>
        <a class="nav-item" href="#" id="signOutLink"><span class="nav-icon">↩</span><span>Sign Out</span></a>
      </nav>
      <button class="theme-toggle" id="themeToggle" type="button"><span>☼</span><span>Light / Dark</span></button>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="search"><input type="search" placeholder="Search stories..."><span class="search-icon">⌕</span></div>
        <div class="topbar-spacer"></div>
        <button class="notification" type="button">♧</button>
        <div class="avatar">A</div>
      </header>

      <div class="content">
        <section class="admin-panel">
          <h1>Admin Dashboard</h1>
          <p>Review RSS news, select issue topics, and publish articles to readers.</p>
        </section>

        <section class="form-card" id="rssNewsSection">
          <h2>Google RSS News</h2>
          <div id="rssNewsList"></div>
        </section>

        <section class="form-card" id="issueReviewSection">
          <h2>Issue Review</h2>
          <form id="issueReviewForm">
            <label for="issueTitle">News Title</label>
            <input id="issueTitle" name="title" readonly />

            <label for="issueSource">Source</label>
            <input id="issueSource" name="source" readonly />

            <label for="issueContent">Article Text</label>
            <textarea id="issueContent" name="content" readonly maxlength="3000"></textarea>

            <button id="analyzeButton" type="button">Analyze Issues</button>
            <div id="aiIssues"></div>

            <button id="publishButton" type="submit" disabled>Publish Article</button>
          </form>
        </section>

        <section class="form-card" id="moderationSection">
          <h2>Pending Moderation</h2>
          <div id="pendingModeration"></div>
        </section>
      </div>
    </main>
  </div>

  <!-- Slim sticky AI chat (from news_template) -->
  <div class="ai-chat-bar">
    <div class="ai-chat-inner">
      <div class="ai-badge">✦</div>
      <div>
        <div class="ai-title">News AI</div>
        <div class="ai-status">Ask about today's stories</div>
      </div>
      <input class="ai-input" id="aiInput" type="text" placeholder="Ask AI about the news...">
      <div class="ai-response" id="aiResponse"></div>
      <button class="ai-send" id="aiSend">Ask AI</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="nctheme.js"></script>
</body>
</html>
