<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In / Sign Up - Pluralist AI</title>
  <link rel="stylesheet" href="nctheme.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo"><div class="logo-icon">▣</div><span>Pluralist AI</span></div>
      <nav class="nav">
        <a class="nav-item" href="/"><span class="nav-icon">⌂</span><span>Home</span></a>
        <a class="nav-item" href="/reader.html"><span class="nav-icon">⌁</span><span>Reader</span></a>
        <a class="nav-item" href="/publisher.html"><span class="nav-icon">▦</span><span>Publisher</span></a>
        <a class="nav-item" href="/admin.html"><span class="nav-icon">⚙</span><span>Admin</span></a>
      </nav>
      <button class="theme-toggle" id="themeToggle" type="button"><span>☼</span><span>Light / Dark</span></button>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="search"><input type="search" placeholder="Search stories..."><span class="search-icon">⌕</span></div>
        <div class="topbar-spacer"></div>
        <button class="notification" type="button">♧</button>
        <div class="avatar">A</div>
      </header>

      <div class="content">
        <section class="form-card">
          <h2>Sign In</h2>
          <form id="loginForm">
            <label for="loginEmail">Email</label>
            <input id="loginEmail" name="email" type="email" required />
            <label for="loginPassword">Password</label>
            <input id="loginPassword" name="password" type="password" required />
            <button type="submit">Sign In</button>
          </form>
        </section>

        <section class="form-card">
          <h2>Sign Up</h2>
          <form id="signUpForm">
            <label for="signupEmail">Email</label>
            <input id="signupEmail" name="email" type="email" required />
            <label for="signupPassword">Password</label>
            <input id="signupPassword" name="password" type="password" required />
            <label for="signupRole">Account Type</label>
            <select id="signupRole" name="role" required>
              <option value="reader">Reader</option>
              <option value="publisher">Publisher</option>
              <option value="admin">Admin</option>
            </select>
            <label for="adminSecret">Admin Secret (only for admin sign-up)</label>
            <input id="adminSecret" name="adminSecret" type="password" />
            <button type="submit">Sign Up</button>
          </form>
        </section>

        <section class="form-card">
          <p>Publisher accounts can upload media and submit articles for admin moderation.</p>
          <p>Readers can sign in to vote on issues attached to articles and use AI chat.</p>
        </section>
      </div>
    </main>
  </div>

  <footer class="chat-footer sticky-footer">
    <div class="chat-box">
      <div class="chat-header">Pluralist AI Chat</div>
      <div class="chat-body" id="chatBody" aria-live="polite"></div>
      <form id="chatForm" class="chat-form">
        <input type="text" name="message" id="chatMessage" placeholder="Ask political or social issue questions only" required maxlength="300" />
        <button type="submit">Send</button>
      </form>
    </div>
  </footer>

  <script src="app.js"></script>
  <script src="nctheme.js"></script>
</body>
</html>
