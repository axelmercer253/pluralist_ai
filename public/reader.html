<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reader Home - Pluralist AI</title>
  <link rel="stylesheet" href="nctheme.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo"><div class="logo-icon">▣</div><span>Pluralist AI</span></div>
      <nav class="nav">
        <a class="nav-item" href="/"><span class="nav-icon">⌂</span><span>Home</span></a>
        <a class="nav-item active" href="/reader.html"><span class="nav-icon">⌁</span><span>Reader</span></a>
        <a class="nav-item" href="/publisher.html"><span class="nav-icon">▦</span><span>Publisher</span></a>
        <a class="nav-item" href="/admin.html"><span class="nav-icon">⚙</span><span>Admin</span></a>
        <a class="nav-item" href="#" id="signOutLink"><span class="nav-icon">↩</span><span>Sign Out</span></a>
      </nav>
      <button class="theme-toggle" id="themeToggle" type="button"><span>☼</span><span>Light / Dark</span></button>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="search"><input type="search" placeholder="Search stories..."><span class="search-icon">⌕</span></div>
        <div class="topbar-spacer"></div>
        <button class="notification" type="button">♧</button>
        <div class="avatar">A</div>
      </header>

      <div class="content">
        <section class="reader-greeting">
          <h1>Reader Home</h1>
          <p>Explore published articles and vote on issues attached to each article.</p>
        </section>

        <section class="article-list" id="articleList"></section>
      </div>
    </main>
  </div>

  <!-- Slim sticky AI chat (from news_template) -->
  <div class="ai-chat-bar">
    <div class="ai-chat-inner">
      <div class="ai-badge">✦</div>
      <div>
        <div class="ai-title">News AI</div>
        <div class="ai-status">Ask about today's stories</div>
      </div>
      <input class="ai-input" id="aiInput" type="text" placeholder="Ask AI about the news...">
      <div class="ai-response" id="aiResponse"></div>
      <button class="ai-send" id="aiSend">Ask AI</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="nctheme.js"></script>
</body>
</html>
